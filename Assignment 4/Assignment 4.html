<!DOCTYPE html>
<html>
<head>
    <title>Employee Registration Form</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .employee-box {
            background-color: white;
            width: 400px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 5px;

            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;

            background-color: blue;
            color: white;

            border: none;
            border-radius: 5px;

            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        .success {
            color: green;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }

    </style>
</head>

<body>

    <div class="employee-box">

        <h2>Employee Registration</h2>

        <form id="employeeForm">

            <label>Employee Name:</label>
            <input type="text" id="name" placeholder="Enter employee name">
            <div id="nameError" class="error"></div>

            <br>

            <label>Email:</label>
            <input type="text" id="email" placeholder="Enter email">
            <div id="emailError" class="error"></div>

            <br>

            <label>Phone Number:</label>
            <input type="text" id="phone" placeholder="Enter phone number">
            <div id="phoneError" class="error"></div>

            <br>

            <label>Department:</label>
            <select id="department">
                <option value="">Select Department</option>
                <option value="HR">HR</option>
                <option value="IT">IT</option>
                <option value="Finance">Finance</option>
                <option value="Marketing">Marketing</option>
                <option value="Sales">Sales</option>
            </select>
            <div id="departmentError" class="error"></div>

            <br>

            <label>Password:</label>
            <input type="password" id="password" placeholder="Enter password">
            <div id="passwordError" class="error"></div>

            <button type="submit">Register</button>

            <div id="successMessage" class="success"></div>

        </form>

    </div>


    <script>

        document.getElementById("employeeForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let phone = document.getElementById("phone").value;
            let department = document.getElementById("department").value;
            let password = document.getElementById("password").value;

            let nameError = document.getElementById("nameError");
            let emailError = document.getElementById("emailError");
            let phoneError = document.getElementById("phoneError");
            let departmentError = document.getElementById("departmentError");
            let passwordError = document.getElementById("passwordError");
            let successMessage = document.getElementById("successMessage");

            nameError.innerHTML = "";
            emailError.innerHTML = "";
            phoneError.innerHTML = "";
            departmentError.innerHTML = "";
            passwordError.innerHTML = "";
            successMessage.innerHTML = "";

            let valid = true;

            if (name == "") {

                nameError.innerHTML = "Employee name is required";
                valid = false;

            } else if (name.length < 3) {

                nameError.innerHTML = "Name must be at least 3 characters";
                valid = false;
            }


            if (email == "") {

                emailError.innerHTML = "Email is required";
                valid = false;

            } else {

                let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (!emailPattern.test(email)) {

                    emailError.innerHTML = "Enter a valid email";
                    valid = false;
                }
            }


            if (phone == "") {

                phoneError.innerHTML = "Phone number is required";
                valid = false;

            } else {

                let phonePattern = /^[0-9]{10}$/;

                if (!phonePattern.test(phone)) {

                    phoneError.innerHTML =
                        "Phone number must contain 10 digits";

                    valid = false;
                }
            }


            if (department == "") {

                departmentError.innerHTML =
                    "Please select a department";

                valid = false;
            }


            if (password == "") {

                passwordError.innerHTML = "Password is required";
                valid = false;

            } else if (password.length < 8) {

                passwordError.innerHTML =
                    "Password must be at least 8 characters";

                valid = false;
            }


            if (valid) {

                successMessage.innerHTML =
                    "Employee registered successfully!";

            }

        });

    </script>

</body>
</html>
